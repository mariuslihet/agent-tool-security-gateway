services:
  gateway:
    build: .
    env_file: .env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_DB: /app/var/gateway.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - gateway-state:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped
    networks: [isolated]
volumes:
  gateway-state:
networks:
  isolated:
    internal: true
